<header class="header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="50" height="50" rx="12" fill="#8B5CF6"/>
        <path d="M25 15C19.477 15 15 19.477 15 25C15 30.523 19.477 35 25 35C30.523 35 35 30.523 35 25C35 19.477 30.523 15 25 15ZM25 32C20.589 32 17 28.411 17 25C17 21.589 20.589 18 25 18C29.411 18 33 21.589 33 25C33 28.411 29.411 32 25 32Z" fill="white"/>
        <path d="M26 22H24V26H20V28H24V32H26V28H30V26H26V22Z" fill="white"/>
      </svg>
      <span class="logo-text">Staffy</span>
    </div>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop">
      <a routerLink="/opportunities" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Oportunidades</a>
      <a routerLink="/organizations" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Organizaciones</a>
      <a *ngIf="isLoggedIn() && isOrganizationRole()" routerLink="/organization/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Panel</a>
      <a *ngIf="isLoggedIn() && isOrganizationRole()" routerLink="/organization/volunteers" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Voluntarios</a>
      <a *ngIf="isLoggedIn() && isVolunteerRole()" routerLink="/shifts" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Mis turnos</a>
    </nav>

    <!-- Right Actions -->
    <div class="header-actions">
      <!-- Notificaciones -->
      <button *ngIf="isLoggedIn()" class="action-btn notifications" title="Notificaciones">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>

      <a *ngIf="!isLoggedIn()" routerLink="/sign-in" class="action-btn auth-link" title="Iniciar sesión">
        <span class="action-text">Iniciar sesión</span>
      </a>

      <!-- Perfil -->
      <a *ngIf="isLoggedIn()" [routerLink]="getProfileLink()" class="action-btn profile" title="Perfil">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="action-text">Perfil</span>
      </a>

      <!-- Cerrar sesión -->
      <button *ngIf="isLoggedIn()" class="action-btn sign-out" (click)="logout()" title="Cerrar sesión">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="action-text">Cerrar sesión</span>
      </button>

      <a *ngIf="!isLoggedIn()" routerLink="/sign-up" class="action-btn auth-link" title="Regístrate">
        <span class="action-text">Regístrate</span>
      </a>

      <!-- Mobile Menu Toggle -->
      <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Side Menu Overlay -->
  <div class="side-menu-overlay" *ngIf="isMenuOpen()" (click)="closeMenu()"></div>

  <!-- Side Menu -->
  <nav class="side-menu" [class.open]="isMenuOpen()">
    <div class="side-menu-header">
      <button class="close-btn" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="side-menu-content">
      <a routerLink="/opportunities" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon"><i class="fa-solid fa-bullhorn"></i></span>
        Oportunidades
      </a>
      <a routerLink="/organizations" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon"><i class="fa-solid fa-building"></i></span>
        Organizaciones
      </a>

      <a *ngIf="isLoggedIn() && isOrganizationRole()" routerLink="/organization/dashboard" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
        Panel
      </a>

      <a *ngIf="isLoggedIn() && isOrganizationRole()" routerLink="/organization/volunteers" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon"><i class="fa-solid fa-users"></i></span>
        Voluntarios
      </a>

      <a *ngIf="isLoggedIn() && isVolunteerRole()" routerLink="/shifts" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon"><i class="fa-solid fa-calendar-alt"></i></span>
        Mis turnos
      </a>

      <div class="side-menu-divider"></div>

      <a *ngIf="!isLoggedIn()" routerLink="/sign-in" routerLinkActive="active" (click)="closeMenu()">
        Iniciar sesión
      </a>

      <a *ngIf="!isLoggedIn()" routerLink="/sign-up" routerLinkActive="active" (click)="closeMenu()">
        Regístrate
      </a>

      <a *ngIf="isLoggedIn()" [routerLink]="getProfileLink()" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon"><i class="fa-solid fa-user"></i></span>
        Perfil
      </a>

      <button *ngIf="isLoggedIn()" class="side-menu-logout" (click)="logout()">
        <span class="icon"><i class="fa-solid fa-sign-out-alt"></i></span>
        Cerrar sesión
      </button>
    </div>
  </nav>
</header>
