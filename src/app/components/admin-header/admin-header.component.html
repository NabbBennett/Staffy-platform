<header class="admin-header">
  <div class="header-container admin-container">
    <!-- Logo Section -->
    <div class="logo admin-logo">
      <svg width="32" height="32" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="50" height="50" rx="12" fill="#8B5CF6"/>
        <path d="M25 15C19.477 15 15 19.477 15 25C15 30.523 19.477 35 25 35C30.523 35 35 30.523 35 25C35 19.477 30.523 15 25 15ZM25 32C20.589 32 17 28.411 17 25C17 21.589 20.589 18 25 18C29.411 18 33 21.589 33 25C33 28.411 29.411 32 25 32Z" fill="white"/>
        <path d="M26 22H24V26H20V28H24V32H26V28H30V26H26V22Z" fill="white"/>
      </svg>
      <div class="logo-copy">
        <span class="logo-text">Staffy</span>
        <span class="admin-caption">Panel Administrativo</span>
      </div>
    </div>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop admin-nav">
      <a routerLink="/admin/reports" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        Reportes
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        Usuarios
      </a>
      <a routerLink="/admin/organizations" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        Organizaciones
      </a>
    </nav>

    <!-- Actions Section -->
    <div class="header-actions admin-actions">
      <button class="action-btn notifications" title="Notificaciones">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>

      <div class="user-info">
        <span class="user-email">{{ userEmail() }}</span>
      </div>

      <button class="action-btn sign-out" (click)="logout()" title="Cerrar sesión">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="action-text">Cerrar sesión</span>
      </button>

      <!-- Mobile Menu Toggle -->
      <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu Overlay & Side Menu -->
  <div class="side-menu-overlay" *ngIf="isMenuOpen()" (click)="closeMenu()"></div>
  <nav class="side-menu admin-side-menu" [class.open]="isMenuOpen()">
    <div class="side-menu-header">
      <span class="side-menu-title">Panel administrativo</span>
      <button class="close-btn" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="side-menu-content">
      <a routerLink="/admin/reports" routerLinkActive="active" (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/>
          <path d="M18 17V9M13 17v-4M8 17v-2"/>
        </svg>
        <span>Reportes</span>
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Usuarios</span>
      </a>
      <a routerLink="/admin/organizations" routerLinkActive="active" (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Organizaciones</span>
      </a>

      <div class="side-menu-divider"></div>

      <button class="side-menu-logout" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </nav>
</header>
